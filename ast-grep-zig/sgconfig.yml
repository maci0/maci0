# ast-grep project config.
#
# ast-grep ships no Zig grammar, so structural search over Zig source needs one
# registered here. Build it with build.sh; the .so is a build artifact and is
# not committed.
ruleDirs:
  - rules
customLanguages:
  zig:
    # Built by build.sh next to this file. Override the output directory with
    # AST_GREP_GRAMMAR_DIR and edit this path to match.
    libraryPath: zig.so
    extensions: [zig]
    # ast-grep rewrites "$VAR" to "<expandoChar>VAR" before parsing the
    # pattern, so the placeholder has to be legal in the target language.
    # Zig identifiers are [A-Za-z0-9_], and "$" parses as an error node, which
    # is why every pattern silently matched nothing until this was set.
    expandoChar: "_"
